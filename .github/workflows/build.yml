name: Build & Test

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (Ubuntu, GCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt & build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6sql6-sqlite libqt6charts6-dev \
            qt6-multimedia-dev \
            qt6-pdf-dev \
            cmake build-essential poppler-utils

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts qtmultimedia qtpdf'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install poppler-utils (pdftotext / pdftoppm)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/oschwartz10612/poppler-windows/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "Kein ZIP-Asset im aktuellen poppler-windows-Release gefunden." }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile poppler.zip
          Expand-Archive -Path poppler.zip -DestinationPath poppler
          $binDir = Get-ChildItem -Path poppler -Recurse -Directory -Filter "bin" | Select-Object -First 1
          if (-not $binDir) { throw "Kein bin-Verzeichnis im entpackten poppler-Archiv gefunden." }
          $binDir.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Show full test log on failure
        if: failure()
        shell: pwsh
        run: Get-Content build\Testing\Temporary\LastTest.log -Tail 300
