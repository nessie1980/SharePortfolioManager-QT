name: Build & Test

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (Ubuntu, GCC)
    # Bewusst ubuntu-latest: der neueste GCC dient als Fruehwarnung. Vom
    # 26.10. bis 01.11.2026 stand der Job fest auf ubuntu-24.04, weil Qt
    # 6.7.0 mit dem GCC von Ubuntu 26 am Linker scheiterte ("multiple
    # definition of QtPrivate::IsFloatType_v<_Float16>" aus
    # qcomparehelpers.h). Behoben ab Qt 6.7.3, seit 01.11.2026 Qt 6.8.3.
    # Siehe ARCHITECTURE.md, "Qt-Version fuer neuere GCC anheben".
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Nur poppler-utils (01.11.2026): cmake und build-essential sind auf
      # den GitHub-Images vorinstalliert, das neuere CMake des Images liegt
      # in /usr/local/bin und wird ohnehin vorgezogen. Siehe ARCHITECTURE.md,
      # "Laufzeit der Build-Pipeline verkuerzen".
      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtcharts qtmultimedia qtpdf'
          # cache: legt die Qt-Installation im Actions-Cache ab; der Schluessel
          # haengt an Version, Plattform und Modulen, ein Qt-Upgrade legt
          # also von selbst einen neuen an (01.11.2026).
          cache: true

      # ccache (01.11.2026): merkt sich uebersetzte Dateien zwischen den
      # Laeufen, unveraenderte Quellen werden dann nicht neu uebersetzt.
      # Der Cache-Schluessel je Job bekommt einen Zeitstempel angehaengt,
      # damit jeder Lauf einen neuen Stand speichert und der naechste den
      # juengsten wiederherstellt. Nur in build.yml: package.yml laeuft zu
      # selten, als dass sich ein eigener Cache lohnt.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
          max-size: 1G

      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # --parallel 4 statt 2 (01.11.2026): fuer oeffentliche Repositories
      # haben die Linux- und Windows-Runner 4 Kerne und 16 GB. Die 2 stammte
      # aus der Anfangszeit mit 2-Kern-Runnern und 7 GB, auf denen mehr
      # parallele Uebersetzungen mit Exit-Code 143 (Speicher) abbrachen.
      - name: Build
        run: cmake --build build --parallel 4

      - name: ccache statistics
        run: ccache --show-stats

      - name: Test
        id: test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      # Nur wenn wirklich die Tests gescheitert sind. Mit blossem failure()
      # lief dieser Schritt auch, wenn ein frueherer Schritt abbrach und
      # deshalb gar nicht getestet wurde - er fand dann keine Logdatei und
      # haengte seinen eigenen Pfadfehler als letzte Zeile ans Protokoll,
      # wo er die echte Ursache verdeckte (12.09.2026).
      - name: Show full test log on failure
        if: failure() && steps.test.outcome == 'failure'
        run: |
          LOG=build/Testing/Temporary/LastTest.log
          if [ -f "$LOG" ]; then
            tail -n 300 "$LOG"
          else
            echo "Keine $LOG vorhanden - ctest ist gescheitert, bevor es ein Protokoll angelegt hat."
          fi

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          # msvc2022 statt msvc2019 seit Qt 6.8 (01.11.2026): ab 6.8 gibt es
          # nur noch Pakete fuer MSVC 2022. Sie laufen auch mit dem Compiler
          # von VS 2026 auf dem Image windows-2025-vs2026 (MSVC 19.51,
          # binaerkompatibel; erster gruener Lauf 01.11.2026).
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts qtmultimedia qtpdf'
          # cache: legt die Qt-Installation im Actions-Cache ab; der Schluessel
          # haengt an Version, Plattform und Modulen, ein Qt-Upgrade legt
          # also von selbst einen neuen an (01.11.2026).
          cache: true

      # vs-shell statt ilammy/msvc-dev-cmd@v1 (18.09.2026): msvc-dev-cmd
      # zielt auch in der neuesten Fassung auf Node 20 und lief nach dessen
      # Entfernung von den Runnern (16.09.2026) nur noch mit Warnung weiter.
      # vs-shell ist eine Composite-Action aus PowerShell und braucht gar
      # kein Node. Setzt wie zuvor die MSVC-Umgebung (vcvars) fuer die
      # folgenden Schritte - Voraussetzung fuer den Ninja-Generator.
      # Siehe ARCHITECTURE.md, "Node-20-Abkuendigung betrifft msvc-dev-cmd".
      - name: Setup MSVC environment
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      # Herausgezogen am 12.09.2026 - der Block stand zeichengleich auch in
      # package.yml. Token gegen die Drosselung der unauthentifizierten
      # GitHub-API, Wiederholungen gegen kurze Ausfaelle.
      - name: Install poppler-utils (pdftotext / pdftoppm)
        uses: ./.github/actions/install-poppler-windows
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ccache, siehe build-linux. Mit MSVC nur zusammen mit dem
      # Ninja-Generator nutzbar und nur ohne /Zi - im Release-Build ohne
      # Debug-Informationen ist das erfuellt.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
          max-size: 1G

      - name: Configure
        run: >-
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # --parallel 4, siehe build-linux.
      - name: Build
        run: cmake --build build --parallel 4

      - name: ccache statistics
        run: ccache --show-stats

      - name: Test
        id: test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      # Siehe die Begruendung beim Linux-Job - genau hier ist der Fall am
      # 12.09.2026 aufgetreten: die Poppler-Installation scheiterte, es wurde
      # nie getestet, und im Protokoll stand als letzte Zeile "Cannot find
      # path ... LastTest.log".
      - name: Show full test log on failure
        if: failure() && steps.test.outcome == 'failure'
        shell: pwsh
        run: |
          $log = "build\Testing\Temporary\LastTest.log"
          if (Test-Path $log) {
            Get-Content $log -Tail 300
          } else {
            Write-Host "Keine $log vorhanden - ctest ist gescheitert, bevor es ein Protokoll angelegt hat."
          }
